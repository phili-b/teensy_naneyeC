site_name: NanEyeC on Teensy 4.1
site_description: Streaming a NanEyeC miniature camera to a PC over USB via a Teensy 4.1
site_url: https://naneye.baetens.de/
repo_url: https://github.com/fiepfiep/teensy_naneyeC
repo_name: fiepfiep/teensy_naneyeC
edit_uri: edit/main/docs/
docs_dir: docs
use_directory_urls: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - content.action.edit
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
    - toc.follow

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Using it:
      - Hardware and bring-up: hardware.md
      - Host software: host.md
  - How it works:
      - Firmware architecture: firmware.md
      - SEIM protocol reference: seim.md
  - Reference:
      - Design record (spec.md): design.md
      - Datasheet cross-check: datasheet-crosscheck.md
      - Glossary: glossary.md
      - How this was built with Claude: built-with-claude.md

plugins:
  - search
  # Lets design.md pull in spec.md from the repo root, so the living design record has
  # exactly one copy and cannot drift from the site.
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.keys
